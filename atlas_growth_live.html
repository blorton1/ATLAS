function scoring(){const m=metrics();const models=Object.entries(MODELS).map(([model,items])=>{const total=items.reduce((t,x)=>t+(+weights[model][x.key]||0),0);return `<div class="card panelpad"><div class="panelhead"><div><h2>${model==='Acquire'?'New-logo score':'Customer growth score'}</h2><p>${model==='Acquire'?'Used for accounts without OpenAI revenue':'Used for both Expand and Deepen accounts'}</p></div>${badge(`${total} raw weight pts`,'grey')}</div>${items.map(item=>`<div class="weight-row"><div class="line"><span>${item.name}</span><strong id="weightval-${model}-${item.key}">${weights[model][item.key]} pts</strong></div><input aria-label="${item.name} weight" type="range" min="0" max="50" step="5" value="${weights[model][item.key]}" data-weight-model="${model}" data-weight-key="${item.key}"/><div class="caption">${item.help}</div></div>`).join('')}<div class="scorefoot"><span>Normalized to 100% at calculation time</span><button class="btn tiny" data-reset-model="${model}">Reset</button></div></div>`}).join('');return sectionIntro('Explainable prioritization','Scoring laboratory','Change the weights to stress-test account rankings. Deployment holds are enforced separately and never overridden by a high score.',`<button class="btn dark" id="resetAllWeights">Reset both models ${icon('refresh','sm')}</button>`)+demoNotice()+`<div class="scoregrid">${models}</div><div class="rowgrid equal" style="margin-top:18px"><div class="card panelpad"><div class="panelhead"><div><h2>Priority tiers and safety gates</h2><p>Weighted score is not a prediction of purchase probability</p></div></div><div class="detail-line"><span>Tier A · score ≥80</span><span>${m.as.filter(x=>tier(x)==='A').length} accounts</span></div><div class="detail-line"><span>Tier B · score 65–79</span><span>${m.as.filter(x=>tier(x)==='B').length} accounts</span></div><div class="detail-line"><span>Tier C · score below 65</span><span>${m.as.filter(x=>tier(x)==='C').length} accounts</span></div><div class="detail-line"><span>On hold (excluded from action)</span><span>${m.as.filter(x=>!eligible(x)).length} accounts</span></div><div class="callout" style="margin-top:14px"><strong>Hard gate:</strong> Security review or contract restrictions require expert validation. A high fit score never grants permission to use sensitive data or start a deployment.</div></div><div class="card panelpad"><div class="panelhead"><div><h2>Live top-five ranking</h2><p>Updates after you change model weights</p></div></div>${sortScore(m.as).filter(eligible).slice(0,5).map((a,i)=>`<div class="detail-line"><span><button class="linkbutton" data-account="${a.id}">${i+1}. ${escapeHTML(a.name)}</button><div class="caption" style="margin-top:4px">${a.motion} · ${a.sector}</div></span><span>${score(a)}/100</span></div>`).join('')}</div></div><div class="card subpanel"><div class="sectionhead"><h2>Scoring formula</h2>${badge('Auditable + editable','green')}</div><p class="small muted" style="line-height:1.8">Score = round( Σ(component rating × selected weight) ÷ Σ(selected weights) ). Individual component ratings range 0–100. Both models use distinct components; Tier A ≥80, Tier B 65–79, Tier C &lt;65. Evidence quality and the security gate are independent from this numerical rank. Ratings and weighting assumptions are synthetic, intended for workshop discussion—not statistically trained buying predictions.</p></div>`}
function methodology(){const defs=[['$100K+ customer count','Unique account IDs with trailing-12-month recognized or invoiced revenue ≥$100,000 at snapshot date. Do not assume this equals a license commitment.'],['Graduated customer count','Accounts moving from TTM revenue < $100K to ≥ $100K over a defined time period, with threshold crossing date.'],['Contracted annual commitment','Annualized, signed minimum software/service commitment; tracked separately from actual consumption and TTM revenue.'],['Net new $100K+ accounts','Previously non-customer accounts reaching the $100K TTM threshold for the first time within the measurement window.'],['$100K+ cohort retention','Share of accounts above $100K at the cohort start that remain above it 12 months later.'],['Sales-accepted account rate','Sales-accepted recommended accounts ÷ all accounts sent to sellers, measured by a consistent acceptance event.'],['Meeting conversion','Unique targeted accounts reaching an initial discovery meeting ÷ unique accounts contacted in the same cohort.'],['Pilot-to-production rate','Validated pilots promoted to paid production usage ÷ pilots with a mature outcome window.'],['Signal-to-contact time','Elapsed time between verified new buying signal and first logged sales action.'],['Qualified sourced pipeline','CRM opportunity value associated with ATLAS-sourced accounts that pass defined qualification standards; excludes fictional scenario whitespace.'],['Multi-product adoption','Share of paying accounts with at least two product families showing active paid use in the measurement period.'],['Precision@20','Sales-accepted recommendations among the top 20 ranked accounts ÷ 20. Useful before closed-won samples mature.']];return sectionIntro('Measurement operating system','GTM playbook & KPI dictionary','A practical operating model for finding, qualifying, converting, and expanding high-value enterprise accounts.')+demoNotice()+`<div class="card panelpad" style="margin-bottom:18px"><div class="panelhead"><div><h2>90-day demonstration plan</h2><p>Use as a proposed interview experiment, not as a promised outcome</p></div></div><div class="strategy"><div class="step"><div class="num">01</div><h3>Days 1–30 · Discover</h3><p>Define ICP, ingest permitted public signals, join authorized CRM fields, resolve entity duplicates, score 500 target accounts, validate a Tier A cohort.</p></div><div class="step"><div class="num">02</div><h3>Days 31–60 · Activate</h3><p>Route qualified accounts to sellers, launch workflow-specific discovery, pilot the highest-evidence use cases, and document measurable ROI.</p></div><div class="step"><div class="num">03</div><h3>Days 61–90 · Learn</h3><p>Evaluate accepted leads, production pilots and qualified opportunities. Compare to a conventional prospecting cohort and recalibrate scoring.</p></div></div></div><div class="rowgrid equal"><div class="card panelpad"><div class="panelhead"><div><h2>Acquisition to expansion journey</h2><p>All success states require CRM / billing evidence</p></div></div>${[['Identify','Signal discovered, account matched and deduplicated'],['Qualify','ICP, workflow, buyer and deployment gate validated'],['Prove','Pilot has baseline, KPI, customer owner and acceptance criteria'],['Deploy','Commercial production deployment and observed usage'],['Expand','Adjacent workflow or department creates incremental value'],['Sustain','Account exceeds $100K TTM and retains that revenue']].map(([a,b],i)=>`<div class="detail-line"><span><b class="textgreen">${String(i+1).padStart(2,'0')}</b> &nbsp;${a}</span><span style="max-width:65%;font-weight:500;color:#6b8490">${b}</span></div>`).join('')}</div><div class="card panelpad"><div class="panelhead"><div><h2>Evidence / data governance</h2><p>Critical distinction: hypothesis is not a verified fact</p></div></div><div class="detail-line"><span>Public signals</span><span>Source URL, event date, collection date</span></div><div class="detail-line"><span>Licensed enrichment</     } else if(form.id==='contactForm') {
      if(!value('contactName'))return fail('Add the stakeholder name.');
      const item={id:value('recordId')||crypto.randomUUID(),name:value('contactName'),role:value('contactRole'),email:value('contactEmail'),influence:value('contactInfluence')};
      changes={contacts:[...(a.contacts||[]).filter(c=>c.id!==item.id),item],shortlisted:true};
    } else if(form.id==='opportunityForm') {
      if(!value('opportunityName'))return fail('Add an opportunity name.');
      const amount=value('opportunityAmount')===''?null:Number(value('opportunityAmount'));
      if(amount!==null&&(!Number.isFinite(amount)||amount<0))return fail('Use a nonnegative amount or leave it blank.');
      const item={id:value('recordId')||crypto.randomUUID(),name:value('opportunityName'),stage:value('opportunityStage'),amount,product:value('opportunityProduct'),nextStep:value('opportunityNextStep')};
      changes={opportunities:[...(a.opportunities||[]).filter(o=>o.id!==item.id),item],shortlisted:true};
    } else {
      if(!value('activityDate')||!value('activitySummary'))return fail('Add a date and summary.');
      const item={id:crypto.randomUUID(),date:value('activityDate'),type:value('activityType'),summary:value('activitySummary')};
      changes={activities:[...(a.activities||[]),item],shortlisted:true};
    }
    await saveAndRender(id,changes,form.querySelector('[type="submit"]'));
  });
  document.addEventListener('click',async event=>{
    const track=event.target.closest('[data-track]');
    if(track){event.preventDefault();event.stopImmediatePropagation();const id=track.dataset.track;if(!tracked(getAccount(baseAccounts.find(a=>a.id===id))))await saveAndRender(id,{shortlisted:true},track);return;}
    const editContact=event.target.closest('[data-edit-contact]'),editOpportunity=event.target.closest('[data-edit-opportunity]');
    if(editContact){state.editContact=editContact.dataset.editContact;showDrawer();return;}
    if(editOpportunity){state.editOpportunity=editOpportunity.dataset.editOpportunity;showDrawer();return;}
    if(event.target.closest('[data-new-contact]')){state.editContact=null;showDrawer();}
    if(event.target.closest('[data-new-opportunity]')){state.editOpportunity=null;showDrawer();}
    if(event.target.closest('#clearManagementFilters')){state.targetReview='All';state.filter={q:'',motion:'All',sector:'All',tier:'All',gate:'All',minScore:0,shortlisted:false,sort:'score'};state.limit=15;render();}
    if(event.target.closest('#copyManagementBrief')){const a=getAccount(baseAccounts.find(x=>x.id===state.drawer));copyText([a.name+' | Federal Account Director interview plan','Relationship label: '+relationship(a),'Owner: '+(a.owner||'Unassigned'),'Objective: '+(a.objectives||'To define'),'Next action: '+(a.nextAction||'To define'),'Stakeholders: '+(a.contacts||[]).map(c=>c.name+' — '+c.role).join(', '),'Open opportunities: '+activeOpportunities(a).length,'Public signal: '+(a.signals[0]?.title||''),'Source: '+(a.signals[0]?.sourceUrl||''),'Customer spend: unknown'].join('\n'));}
  },true);
  document.addEventListener('change',event=>{
    if(event.target.id==='targetReviewFilter'){state.targetReview=event.target.value;state.limit=15;renderExplorerRows();}
    if(event.target.id==='relationshipFilter'){state.managementFilter=event.target.value;render();}
  });
  const previousRender=render;
  render=()=>{previousRender();$('breadcrumbs').textContent=labels[state.view]||'Workspace';};
  downloadCSV=()=>{
    const headers=['company','relationship_label','tracked','owner','stage','objectives','next_action','due_date','notes','contacts_json','opportunities_json','activities_json','target_review','stage_source','public_signal','public_source','openai_spend'];
    const accounts=state.view==='explorer'?filterAccounts():state.view==='acquisition'?all().filter(tracked):all();
    const rows=accounts.map(a=>[a.name,relationship(a),tracked(a),a.owner,a.stage,a.objectives,a.nextAction,a.nextActionDate,a.notes,JSON.stringify(a.contacts||[]),JSON.stringify(a.opportunities||[]),JSON.stringify(a.activities||[]),review(a),a.stageSource,a.signals[0]?.title,a.signals[0]?.sourceUrl,'']);
    const cell=value=>{let text=String(value??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};
    const csv=[headers,...rows].map(row=>row.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='ATLAS_accounts_and_prospects.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
  };
}

routeHash();
const requested=new URLSearchParams(location.search).get('account');
if(requested && baseAccounts.some(a=>a.id===requested)){state.drawer=requested;showDrawer();}
})();
</script>
</body>
</html>
